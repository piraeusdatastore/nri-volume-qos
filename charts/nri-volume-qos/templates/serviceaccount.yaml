{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nri-volume-qos.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nri-volume-qos.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
