{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nri-volume-qos.fullname" . }}
  labels:
    {{- include "nri-volume-qos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nri-volume-qos.fullname" . }}
  labels:
    {{- include "nri-volume-qos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nri-volume-qos.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nri-volume-qos.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
