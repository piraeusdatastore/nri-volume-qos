  - qos
  - io
  - cgroup
  - csi
  - storage
  - daemonset
home: https://github.com/piraeusdatastore/nri-volume-qos
sources:
  - https://github.com/piraeusdatastore/nri-volume-qos
maintainers:
  - name: Piraeus Datastore
    url: https://piraeus.io
