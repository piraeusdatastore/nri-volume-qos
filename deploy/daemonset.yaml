---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nri-volume-qos
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nri-volume-qos
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nri-volume-qos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nri-volume-qos
subjects:
  - kind: ServiceAccount
    name: nri-volume-qos
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nri-volume-qos
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nri-volume-qos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nri-volume-qos
    spec:
      serviceAccountName: nri-volume-qos
      hostPID: false
      priorityClassName: system-node-critical
      containers:
        - name: nri-volume-qos
          image: quay.io/piraeusdatastore/nri-volume-qos:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            # kubelet pod volume directory — lets us read vol_data.json to
            # resolve the VolumeAttachment for each CSI mount
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            # host /dev — needed to stat block devices and resolve major:minor
            - name: dev
              mountPath: /host/dev
              readOnly: true
            # NRI socket exposed by containerd / CRI-O
            - name: nri-sock
              mountPath: /var/run/nri
      volumes:
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nri-sock
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
